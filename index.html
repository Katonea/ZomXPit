<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
'use strict';
/* 몬스터 볼핏 — M1 전투 코어 + M2 레벨과 보스 + M3 핀볼 머신 + 성 침략 (DESIGN.md 4~8·17장). 움직이는 성 콘셉트, 2.5D 벡터 아트
 * 보드 하단 70%를 자유 이동. 공은 바닥에 닿거나 몸에 닿으면 회수되고, 회수된 공만 다시 발사된다.
 * 레벨 = 웨이브 → (중간 보스 처치 시 보드 확장) → 최종 보스. 레벨 1~10, 첫 클리어마다 다음 레벨 해금.
 */
const W = 720, H = 1280, TOP = 70, BOT = H - 130, PMIN = TOP + .3*(BOT - TOP), STEP = 1/120;
const FIELD = {startW:420, openW:580, openTime:1.5}; // 보드 폭: 좁게 시작해 중간 보스를 잡으면 넓어진다
const SAVE_KEY = 'monsterpit.save.v1';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = '"Noto Sans KR",sans-serif';

// ---------- 난수 (시드 가능, 봇 테스트 재현용) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;
const wpick = ws => { let r = rand() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ws.length; i++) if ((r -= ws[i]) < 0) return i; return ws.length - 1; };

// ---------- 데이터: 볼 기능 (DESIGN 7장) ----------
const P = v => Math.round(v * 100) + '%';
const FN = {
  fire:   {name:'화염', pre:'불꽃', color:'#ff8a3d', e1:{pct:.20}, e5:{pct:.40}, cap:{pct:1.2}, d:v => '화상 ' + P(v.pct) + '/초'},
  frost:  {name:'얼음', pre:'서리', color:'#7fd3f5', e1:{slow:.30, freeze:1}, e5:{slow:.50, freeze:2}, cap:{slow:.8, freeze:4}, d:v => '둔화 ' + P(v.slow) + ' · 빙결 ' + v.freeze.toFixed(1) + '초'},
  poison: {name:'독',   pre:'독',   color:'#8bd65a', e1:{max:3}, e5:{max:7}, cap:{max:15}, d:v => '독 최대 ' + Math.round(v.max) + '중첩'},
  spark:  {name:'번개', pre:'번개', color:'#ffe25a', e1:{n:2, pct:.6}, e5:{n:4, pct:.8}, cap:{n:8, pct:1.5}, d:v => '연쇄 ' + Math.round(v.n) + '명 ' + P(v.pct)},
  bomb:   {name:'폭탄', pre:'폭발', color:'#ff5a6a', e1:{r:50, pct:.5}, e5:{r:80, pct:.8}, cap:{r:160, pct:1.5}, d:v => '폭발 반경 ' + Math.round(v.r) + ' · 주변 피해 ' + P(v.pct)},
  split:  {name:'분열', pre:'쌍둥이', color:'#f3d9a0', e1:{n:1}, e5:{n:3}, cap:{n:6}, d:v => '분열 ' + Math.round(v.n) + '개'},
  pierce: {name:'관통', pre:'가시', color:'#b8c0d0', e1:{n:1}, e5:{n:3}, cap:{n:8}, d:v => '관통 ' + Math.round(v.n) + '회'},
  vamp:   {name:'흡혈', pre:'흡혈', color:'#d04060', e1:{pct:.01}, e5:{pct:.03}, cap:{pct:.08}, d:v => '흡혈 ' + (v.pct*100).toFixed(1) + '%'},
  wind:   {name:'바람', pre:'바람', color:'#b9f0d0', e1:{px:20}, e5:{px:60}, cap:{px:120}, d:v => '밀치기 ' + Math.round(v.px)},
  giant:  {name:'거대', pre:'왕',   color:'#c08850', e1:{size:.2, dmg:.1}, e5:{size:.6, dmg:.4}, cap:{size:1.5, dmg:1.5}, d:v => '크기 +' + P(v.size) + ' 피해 +' + P(v.dmg)},
  homing: {name:'유도', pre:'추적', color:'#b48cff', e1:{deg:60}, e5:{deg:150}, cap:{deg:400}, d:v => '유도 ' + Math.round(v.deg) + '°/초'},
  curse:  {name:'저주', pre:'저주', color:'#9a5ad0', e1:{pct:.10}, e5:{pct:.25}, cap:{pct:.6}, d:v => '받는 피해 +' + P(v.pct)},
  bleed:  {name:'출혈', pre:'피칼', color:'#e0405a', e1:{pct:.3}, e5:{pct:.6}, cap:{pct:2}, d:v => '출혈 ' + P(v.pct) + ' (3초)'},
  crit:   {name:'치명', pre:'치명', color:'#ff4ad0', e1:{pct:.1}, e5:{pct:.25}, cap:{pct:.6}, d:v => '치명타 확률 +' + P(v.pct)},
  stun:   {name:'기절', pre:'쾅쾅', color:'#d0b040', e1:{pct:.1, t:.5}, e5:{pct:.25, t:.8}, cap:{pct:.5, t:1.5}, d:v => P(v.pct) + ' 확률 기절 ' + v.t.toFixed(1) + '초'},
  echo:   {name:'메아리', pre:'메아리', color:'#6af0ff', e1:{pct:.4}, e5:{pct:.8}, cap:{pct:2}, d:v => '0.4초 뒤 같은 자리 재타격 ' + P(v.pct)},
  meteor: {name:'운석', pre:'운석', color:'#ff7a1a', e1:{p:.1, r:90}, e5:{p:.2, r:130}, cap:{p:.5, r:220}, d:v => P(v.p) + ' 확률 운석 낙하 (반경 ' + Math.round(v.r) + ')'},
  holy:   {name:'신성', pre:'신성', color:'#fff2a0', e1:{pct:.3}, e5:{pct:.8}, cap:{pct:3}, d:v => '보스·정예 피해 +' + P(v.pct)},
  // 2026-10-14 추가 12종
  lucky:  {name:'행운', pre:'행운', color:'#6ad86a', e1:{pct:.3}, e5:{pct:.8}, cap:{pct:2}, d:v => '이 볼로 처치하면 경험치 +' + P(v.pct)},
  rot:    {name:'부패', pre:'썩은', color:'#b0a060', e1:{pct:.02}, e5:{pct:.05}, cap:{pct:.12}, d:v => '적 최대 HP의 ' + P(v.pct) + ' 추가 피해 (보스는 1/10)'},
  swift:  {name:'가속', pre:'번쩍', color:'#8ae8ff', e1:{spd:.15, dmg:.05}, e5:{spd:.4, dmg:.15}, cap:{spd:.8, dmg:.5}, d:v => '공 속도 +' + P(v.spd) + ' · 피해 +' + P(v.dmg)},
  acid:   {name:'산성', pre:'산성', color:'#c8f03a', e1:{pct:.4}, e5:{pct:1}, cap:{pct:1}, d:v => '방패·안전모 관통 ' + P(v.pct)},
  ricochet:{name:'도탄', pre:'도탄', color:'#e8c890', e1:{n:1}, e5:{n:3}, cap:{n:6}, d:v => '맞히면 가까운 적에게 꺾여 날아감 ' + Math.round(v.n) + '회'},
  shatter:{name:'파쇄', pre:'파쇄', color:'#b8e8ff', e1:{pct:.5}, e5:{pct:1.2}, cap:{pct:3}, d:v => '얼거나 느려지거나 기절한 적에게 피해 +' + P(v.pct)},
  nova:   {name:'폭죽', pre:'폭죽', color:'#ff9a5a', e1:{r:60, pct:.5}, e5:{r:100, pct:1}, cap:{r:180, pct:2}, d:v => '이 볼로 처치하면 그 자리 폭발 (반경 ' + Math.round(v.r) + ' ' + P(v.pct) + ')'},
  gravity:{name:'중력', pre:'중력', color:'#9a7ae8', e1:{r:90, px:30}, e5:{r:150, px:60}, cap:{r:260, px:120}, d:v => '맞은 자리로 반경 ' + Math.round(v.r) + ' 적을 끌어당김'},
  execute:{name:'처형', pre:'처형', color:'#d04848', e1:{pct:.1}, e5:{pct:.2}, cap:{pct:.35}, d:v => 'HP ' + P(v.pct) + ' 이하 일반 적 즉시 처치 · 보스·정예 피해 +' + P(v.pct)},
  prism:  {name:'프리즘', pre:'무지개', color:'#ff9ae8', e1:{n:2, pct:.4}, e5:{n:3, pct:.7}, cap:{n:6, pct:1.5}, d:v => '맞히면 무작위 적 ' + Math.round(v.n) + '명에게 빛줄기 ' + P(v.pct)},
  chrono: {name:'시간', pre:'시계', color:'#e8d898', e1:{p:.05, t:1}, e5:{p:.1, t:1.5}, cap:{p:.25, t:3}, d:v => P(v.p) + ' 확률로 일반 적 모두 ' + v.t.toFixed(1) + '초 정지'},
  phoenix:{name:'불사조', pre:'불사조', color:'#ff6a3a', e1:{hp:.3}, e5:{hp:.6}, cap:{hp:1}, d:v => '판마다 한 번, 쓰러지면 HP ' + P(v.hp) + '로 부활'},
};
// 진화 (Ball x Pit식, DESIGN 6.6): 정해진 두 볼이 각각 Lv5 단일 볼이면 레벨업 카드에 '진화'가 먼저 뜬다. 진화 볼 = 두 기능 + 고유 효과, 유효 레벨 +3
const EVO = {
  inferno:  {name:'지옥불 볼', of:['fire', 'bomb'], d:'폭발 반경 1.6배, 휩쓸린 적 모두 화상'},
  blizzard: {name:'눈보라 볼', of:['frost', 'spark'], d:'번개가 옮겨 간 적이 곧바로 얼어붙음'},
  plague:   {name:'역병 볼', of:['poison', 'bleed'], d:'맞은 적의 독이 가까운 적 3명에게 옮음'},
  lance:    {name:'거인 창 볼', of:['pierce', 'giant'], d:'모든 적을 관통'},
  bloodmoon:{name:'핏빛 달 볼', of:['vamp', 'curse'], d:'주변 적 모두 저주 · 흡혈 2배'},
  sniper:   {name:'저격 볼', of:['homing', 'crit'], d:'치명타 확률 +30% · 치명타 피해 3배'},
  mirror:   {name:'거울 볼', of:['split', 'echo'], d:'분열 +2개 · 메아리 두 번'},
  comet:    {name:'혜성 볼', of:['wind', 'meteor'], d:'맞힐 때마다 운석 · 반경 1.5배'},
};
const evoOf = (a, b) => a.fns.length === 1 && b.fns.length === 1 && a.lv === RULE.maxLv && b.lv === RULE.maxLv ? Object.keys(EVO).find(k => EVO[k].of.includes(a.fns[0]) && EVO[k].of.includes(b.fns[0]) && a.fns[0] !== b.fns[0]) || null : null;
// r = 몸 판정 반지름, catchR = 공 회수 판정 (소녀: +30%). id는 옛 저장과 맞추려고 거북 시절 이름 그대로
// ---------- 데이터: 캐릭터 (DESIGN 9장) ----------
// 기본 능력치는 공통(공격 10, HP 120, 방어 10, 이동 228 (구 380의 60%)). 캐릭터마다 시작 볼과 능력이 다름. 플레이어 레벨·장착 볼은 buildChar에서 더해진다
const CHAR = {
  hero:{name:'소녀', start:[['bomb']], catchR:26, desc:'받기 판정 +30%. 시작 캐릭터'},
  slime:{name:'소방관', start:[['split']], hpMul:1.25, spdMul:.9, desc:'최대 HP +25%, 이동속도 -10%'},
  mushroom:{name:'과학자', start:[['poison']], statusMul:1.3, desc:'상태이상 지속시간 +30%'},
  bat:{name:'펑크', start:[['homing']], ballMul:1.15, vampMul:2, desc:'공 속도 +15%, 흡혈 효과 2배'},
  mimic:{name:'해커', start:'random2', upMul:1.5, hpMul:.85, desc:'공짜 강화 드롭률 +50%, 최대 HP -15%'},
  golem:{name:'군인', start:[['pierce']], defMul:1.4, normal:2, normalSize:1.5, desc:'방어력 +40%, 일반 볼 2발(크기 +50%)'},
  police:{name:'경찰', start:[['spark']], magnet:60, desc:'아이템 획득 범위 +60'},
  chef:{name:'요리사', start:[['fire']], hpMul:1.15, upMul:1.2, desc:'최대 HP +15%, 공짜 강화 드롭률 +20%'},
};
// ---------- 데이터: 볼 컬렉션 (DESIGN 11장) ----------
// 볼 종류 = 기능 하나. 선물 상자 잭팟·침략 처치에서 얻고, 같은 볼을 또 얻으면 사본이 쌓인다. 사본이 모이면 볼 레벨을 올린다(레벨당 피해 +10%). 골드는 없다 — 재화는 핀볼 하나
// 최대 8개를 장착(deck)하면 전투를 그 볼들로 시작한다. 캐릭터 시작 볼은 항상 함께 들고 간다
const BALL_RARITY = {fire:'common', frost:'common', poison:'common', wind:'common', spark:'uncommon', bomb:'uncommon', pierce:'uncommon', split:'uncommon', bleed:'uncommon',
  vamp:'rare', giant:'rare', homing:'rare', curse:'rare', crit:'rare', stun:'rare', echo:'unique', meteor:'unique', holy:'unique',
  lucky:'common', rot:'common', swift:'common', acid:'uncommon', ricochet:'uncommon', shatter:'uncommon', nova:'rare', gravity:'rare', execute:'rare', prism:'unique', chrono:'unique', phoenix:'unique'};
const BALL_IDS = Object.keys(BALL_RARITY), DECK_MAX = 8, BALL_MAXLV = 10;
const ballCopies = lv => lv;                                              // 다음 레벨에 필요한 사본 (Lv1→2: 1장, Lv2→3: 2장 ...)
const ballBonus = id => { const o = META.bag && META.bag[id]; return o ? .1*(o.lv - 1) : 0; };
function gainBall(id) { const o = META.bag[id]; if (o) o.n++; else META.bag[id] = {n:0, lv:1}; return {kind:'ball', id, isNew:!o}; }
function rollBall(table, mult = 1) { // 배율만큼 사본이 한꺼번에 (첫 장은 해금, 나머지는 사본)
  const r = wkey(table), pool = BALL_IDS.filter(id => BALL_RARITY[id] === r), g = gainBall(pool[Math.floor(rand()*pool.length)]);
  if (mult > 1) { META.bag[g.id].n += mult - 1; g.mult = mult; } return g;
}
function upgradeBall(id) {
  const o = META.bag[id]; if (!o || o.lv >= BALL_MAXLV || o.n < ballCopies(o.lv)) return false;
  o.n -= ballCopies(o.lv); o.lv++; saveMeta(); return true;
}
function toggleDeck(id) { const d = META.deck, i = d.indexOf(id); if (i >= 0) d.splice(i, 1); else if (META.bag[id] && d.length < DECK_MAX) d.push(id); else return false; saveMeta(); return true; }
// 플레이어 레벨 (DESIGN 12장): 핀볼 경험치 슬롯으로 오르고, 레벨마다 기본 능력치가 오른다
const PLV = {need:lv => 20 + 12*lv, atk:1, hp:10, def:1};
const plvStats = () => { const k = (META.plv || 1) - 1; return {atk:PLV.atk*k, hp:PLV.hp*k, def:PLV.def*k}; };
function gainExp(n) { META.plv = META.plv || 1; META.pxp = (META.pxp || 0) + n; const ups = []; while (META.pxp >= PLV.need(META.plv)) { META.pxp -= PLV.need(META.plv); ups.push(++META.plv); } return ups; }
function buildChar(sel, tut) { // 선택 캐릭터 + 플레이어 레벨 + 장착 볼 = 이번 판 능력치
  const id = CHAR[sel] ? sel : 'hero', c = CHAR[id], P = plvStats();
  let start = c.start;
  if (start === 'random2') { const ks = Object.keys(FN), a = ks.splice(Math.floor(rand()*ks.length), 1)[0], b = ks[Math.floor(rand()*ks.length)]; start = [[a], [b]]; }
  const own = start.flat(), pool = (META.deck || []).filter(b => FN[b] && !own.includes(b));
  const pick = tut ? [] : (META.pick ? META.pick.filter(b => pool.includes(b)) : pool).slice(0, 2); // 튜토리얼(레벨 1 첫 도전)은 캐릭터 볼만 // 입장 때 고른 2개 (고른 적 없으면 장착 볼 앞에서 2개)
  start = [...start, ...pick.map(b => [b])];
  return {id, name:c.name, atk:10 + P.atk, hp:Math.round((120 + P.hp)*(c.hpMul || 1)), def:(10 + P.def)*(c.defMul || 1),
    spd:228*(c.spdMul || 1), r:20, catchR:c.catchR || 20, normal:c.normal || 3, normalSize:c.normalSize || 1, ballMul:c.ballMul || 1, upMul:c.upMul || 1,
    statusMul:c.statusMul || 1, vampMul:c.vampMul || 1, magnet:c.magnet || 0, start};
}
const ballSpd = () => RULE.ballSpeed*S.ch.ballMul;

// ---------- 데이터: 적 (DESIGN 8장) ----------
// hp는 레벨 1 기준. 실제 HP = hp × 레벨 hpMul × (1 + 경과시간/hpGrow) × (정예 5). ps = 픽셀 크기
// 근접: 플레이어에게 다가가 닿으면 atkEvery초마다 공격 (몸이 닿는 동안만) / charger: 접근 → 0.7초 예고 → 직선 돌진 → 휴식 / ranged: stopY에서 화살 / support: 회복 / caster: 결계 / bomb: 바닥 도달 시 자폭
// guard: 앞(플레이어 쪽)에서 맞은 공은 튕기고 피해 없음. 폭발·연쇄·화상 같은 간접 피해는 방패와 무관
const ENEMY = {
  knight: {name:'좀비', r:20, hp:29, spd:55,  xp:3, dmg:6,  atkEvery:2,   ps:3},
  archer: {name:'군인 좀비', r:20, hp:24, spd:50,  xp:4, dmg:4,  ranged:true, fireEvery:5, shotSpd:240, ps:3},
  shield: {name:'방패 경찰',    r:22, hp:32, spd:40,  xp:5, dmg:8,  atkEvery:2.2, ps:3, guard:true},
  priest: {name:'간호사 좀비',      r:20, hp:22, spd:45,  xp:5, ps:3, support:true, healEvery:3, healR:150, heal:.25},
